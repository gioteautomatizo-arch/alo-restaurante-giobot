name: Quality checks

on:
  push:
    branches:
      - main
      - integration
      - feat/gioteautomatizo-multinegocio-core
  pull_request:
    branches:
      - main
      - integration

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without changing repository files
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify platform login branding (static assets, no Firebase writes)
        run: node scripts/test-platform-branding.mjs
      - name: Test public home navigation and legacy Calientito links (no Firebase writes)
        run: node --import tsx scripts/test-platform-home-routing.mts
      - name: Test safe order notifications (no Firebase writes)
        run: node --import tsx scripts/test-business-order-alerts.mts
      - name: Test paid sales reports (no Firebase writes)
        run: node --import tsx scripts/test-business-reports.mts
      - name: Test shared Resumen and Caja payment snapshot (synthetic data, no Firebase writes)
        run: node --import tsx scripts/test-business-order-snapshot.mts
      - name: Test tenant-safe shift readiness (no Firebase writes)
        run: node --import tsx scripts/test-business-shift-readiness.mts
      - name: Test workspace tenant and account isolation (no Firebase writes)
        run: node --import tsx scripts/test-business-workspace-isolation.mts
      - name: Test business portal account switch and retry (mocked Auth/Firestore, no Firebase writes)
        run: node scripts/test-business-portal-isolation-ui.mjs
      - name: Test business account list fail-closed on partial reads (mocked Firestore, no writes)
        run: node scripts/test-business-account-list.mjs
      - name: Test opt-in secure business list client (mocked Auth/API, no Firestore writes)
        run: node scripts/test-business-directory-client.mjs
      - name: Test platform Super Admin service session and tenant integrity (mocked Firebase, no writes)
        run: node scripts/test-platform-admin-service-session.mjs
      - name: Test platform Super Admin panel account switch and retry (React/jsdom, no Firebase writes)
        run: node scripts/test-platform-admin-session-ui.mjs
      - name: Guard tenant reassignment proposal against rule drift (read-only, no Firebase)
        run: node scripts/test-tenant-update-isolation-static.mjs
      - name: Test tenant module sorting after tenant-only query (synthetic, no Firebase)
        run: node --import tsx scripts/test-tenant-module-sort.mts
      - name: Preflight nested tenant historical identity and full inventory coverage (synthetic, no Firebase)
        run: node scripts/test-tenant-module-inventory-preflight.mjs
      - name: Test historical business handle migration preflight (synthetic inventory, no Firebase)
        run: node scripts/test-business-handle-migration-preflight.mjs
      - name: Diagnose registration cutover and fail-closed rollback (read-only, no Firebase)
        run: node scripts/test-business-registration-cutover-audit.mjs
      - name: Test owner registration session drift (mocked Auth/Firestore, no writes)
        run: node scripts/test-business-registration-session.mjs
      - name: Guard candidate three-document registration parity and activation (read-only)
        run: node scripts/test-business-registration-candidate-parity.mjs
      - name: Test registration cutover and rollback preflight (synthetic, no Firebase)
        run: node scripts/test-business-registration-cutover-gate.mjs
      - name: Guard candidate activation across all production sources (TypeScript AST, no Firebase)
        run: node scripts/test-inactive-registration-candidate.mjs && node scripts/guard-inactive-registration-candidate.mjs
      - name: Test onboarding duplicate submit and stale navigation (React/jsdom, no Firebase)
        run: node scripts/test-business-onboarding-submit-ui.mjs
      - name: Test complete six-screen onboarding for two fictitious businesses (React/jsdom, mocked backend)
        run: node scripts/test-business-onboarding-journey-ui.mjs
      - name: Test invite acceptance tenant isolation and retry (mocked Auth/backend, no Firebase writes)
        run: node scripts/test-business-invite-accept-ui.mjs
      - name: Test catalog and publication session drift (mocked Auth/Firestore, no real writes)
        run: node scripts/test-business-catalog-publication-session.mjs
      - name: Test catalog editor read failure and tenant switch (React/jsdom, no Firebase writes)
        run: node scripts/test-business-catalog-editor-read-ui.mjs
      - name: Test employee roster and invitations tenant isolation (React/jsdom, mocked services)
        run: node scripts/test-business-employees-isolation-ui.mjs
      - name: Test employee roster identity and session integrity (mocked Firestore/Auth, no writes)
        run: node scripts/test-business-employee-roster-integrity.mjs
      - name: Test workspace publication retry and account isolation (React/jsdom, mocked Firebase)
        run: node scripts/test-business-workspace-publication-ui.mjs
      - name: Test branding saves and uploads on tenant/account changes (React/jsdom, mocked backend)
        run: node scripts/test-business-branding-session-ui.mjs
      - name: Test shift cash reconciliation (synthetic data, no Firebase writes)
        run: node --import tsx scripts/test-shift-sales.mts
      - name: Test table QR decoding and routing (no Firebase writes)
        run: node --import tsx scripts/test-business-table-qr.mts
      - name: Test sent order receipts (local tab storage, no Firebase writes)
        run: node --import tsx scripts/test-public-order-receipts.mts
      - name: Test persistent public checkout attempt IDs (local tab storage, no Firebase writes)
        run: node --import tsx scripts/test-public-order-attempt.mts
      - name: Test public order stable document write path (mocked Firestore, no writes)
        run: node scripts/test-public-order-write-path.mjs
      - name: Test public checkout interactions (mocked backend, no Firebase writes)
        run: node scripts/test-public-checkout-ui.mjs
      - name: Test safe public catalog checkout (no Firebase writes)
        run: node --import tsx scripts/test-business-public-catalog.mts
      - name: Test isolated trusted public order price calculation (synthetic, no backend writes)
        run: node --import tsx scripts/test-public-order-authority-core.mts
      - name: Test business order QR channel labels (no Firebase writes)
        run: node --import tsx scripts/test-business-order-channel.mts
      - name: Test business POS readiness and order list isolation (synthetic data, no Firebase writes)
        run: node --import tsx scripts/test-business-pos-readiness.mts
      - name: Test atomic business order status transitions (mocked Firestore, no real writes)
        run: node scripts/test-business-order-status-atomic.mjs
      - name: Verify staged VIP isolation (no deployment)
        run: node scripts/verify-vip-staged.mjs
