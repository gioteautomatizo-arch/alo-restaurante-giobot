name: Staged Firestore security tests
on:
  push:
    branches:
      - feat/gioteautomatizo-multinegocio-core
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify staged-only guard
        run: node scripts/verify-vip-staged.mjs
      - name: Test tenant isolation with Firestore Emulator
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-security-test --config scripts/firebase.security-emulator.json "node scripts/test-firestore-vip.mjs"
      - name: Test staged order and catalog permissions
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-launch-security-test --config scripts/firebase.launch-security-emulator.json "node scripts/test-launch-security.mjs"
