name: Staged Firestore security tests
on:
  push:
    branches:
      - feat/gioteautomatizo-multinegocio-core
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify staged-only guard
        run: node scripts/verify-vip-staged.mjs && node scripts/verify-launch-rules.mjs
      - name: Verify emulator rules resolve (fail closed)
        run: node scripts/verify-emulator-rule-paths.mjs
      - name: Test tenant isolation with Firestore Emulator
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-security-test --config firebase.security-emulator.json "node scripts/test-firestore-vip.mjs"
      - name: Test staged order and catalog permissions
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-launch-security-test --config firebase.launch-security-emulator.json "node scripts/test-launch-security.mjs"
      - name: Test real menu draft CAS and two-business isolation (Firestore Emulator only)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-draft-cas-emulator-test --config firebase.launch-security-emulator.json "node scripts/test-business-menu-draft-emulator.mjs"
      - name: Test real catalog identity and CAS fail-closed for two businesses
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-catalog-identity-emulator-test --config firebase.launch-security-emulator.json "node scripts/test-business-catalog-identity-emulator.mjs"
      - name: Diagnose public menu draft exposure and test isolated private-read proposal
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-menu-draft-proposal --config firebase.launch-security-emulator.json "node scripts/test-menu-import-draft-rule-proposal.mjs"
      - name: Test combined three-document OWNER and private catalog proposals (emulator only, no deployment)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-owner-draft-composed-test --config firebase.launch-security-emulator.json "node scripts/test-registration-private-catalog-composed.mjs"
      - name: Diagnose OWNER/root mismatch and test isolated root-identity gate (emulator only)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-owner-root-identity-test --config firebase.launch-security-emulator.json "node scripts/test-owner-root-identity-composed.mjs"
      - name: Test composed OWNER/root batch access budget (emulator only)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-owner-batch-budget-test --config firebase.launch-security-emulator.json "node scripts/test-owner-root-batch-budget.mjs"
      - name: Diagnose public order price authority gap (expected PENDIENTE, emulator only)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-public-price-authority-audit --config firebase.launch-security-emulator.json "node scripts/test-public-order-price-authority-audit.mjs"
      - name: Test isolated public order write gate candidate (emulator only, no rule deployment)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-public-order-gate-proposal --config firebase.launch-security-emulator.json "node scripts/test-public-order-write-gate-proposal.mjs"
      - name: Test isolated trusted public order transaction (Admin SDK, emulator only, no endpoint)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-public-order-transaction-test --config firebase.launch-security-emulator.json "node --import tsx scripts/test-public-order-authority-transaction.mts"
      - name: Test real tenant order status transactions with Firestore Emulator
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-order-status-emulator-test --config firebase.launch-security-emulator.json "node scripts/test-business-order-status-emulator.mjs"
      - name: Diagnose cross-tenant update reassignment and test isolated invariant proposal
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-tenant-update-isolation-test --config firebase.launch-security-emulator.json "node scripts/test-tenant-update-isolation-proposal.mjs"
      - name: Test atomic owner registration and employee access
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-owner-security-test --config firebase.launch-security-emulator.json "node scripts/test-owner-registration.mjs"
      - name: Test synthetic two-business backup and restore rehearsal (Firestore Emulator only)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-restore-rehearsal-test --config firebase.launch-security-emulator.json "node scripts/test-business-restore-rehearsal.mjs"
      - name: Test isolated atomic OWNER rule proposal (no rule deployment)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-atomic-owner-proposal-test --config firebase.launch-security-emulator.json "node scripts/test-owner-atomic-proposal.mjs"
      - name: Diagnose malformed tenant memberships and test isolated identity gate (no rule deployment)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-membership-identity-test --config firebase.launch-security-emulator.json "node scripts/test-membership-identity-proposal.mjs"
      - name: Test opt-in private business list with two tenants (Auth+Firestore Emulator, no deployment)
        run: npx firebase emulators:exec --only auth,firestore --project gioteautomatizo-secure-business-list-test --config firebase.invites-emulator.json "node --import tsx scripts/test-business-directory-api.mjs"
      - name: Diagnose business handle reuse and test isolated no-client-delete proposal
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-handle-reuse-proposal-test --config firebase.launch-security-emulator.json "node scripts/test-business-handle-reuse-proposal.mjs"
      - name: Test isolated permanent business handle reservations (no rule deployment)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-permanent-handle-proposal-test --config firebase.launch-security-emulator.json "node scripts/test-business-permanent-handle-proposal.mjs"
      - name: Test registration client/rules version matrix and rollback (emulator only)
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-registration-version-matrix-test --config firebase.launch-security-emulator.json "node scripts/test-business-registration-version-matrix.mjs staged && node scripts/test-business-registration-version-matrix.mjs freeze-before && node scripts/test-business-registration-version-matrix.mjs candidate && node scripts/test-business-registration-version-matrix.mjs freeze-after && node scripts/test-business-registration-version-matrix.mjs rollback"
      - name: Test frozen registration with real Auth account and two-document client (emulators only)
        run: npx firebase emulators:exec --only auth,firestore --project gioteautomatizo-registration-freeze-auth-test --config firebase.invites-emulator.json "node --import tsx scripts/test-business-registration-freeze-auth.mts"
      - name: Test candidate three-document onboarding with permanent handles (emulators only)
        run: npx firebase emulators:exec --only auth,firestore --project gioteautomatizo-three-doc-onboarding-test --config firebase.invites-emulator.json "node --import tsx scripts/test-business-three-document-registration-emulator.mts"
      - name: Test real two-business registration and invitation flow in emulators
        run: npx firebase emulators:exec --only auth,firestore --project gioteautomatizo-registration-e2e-test --config firebase.invites-emulator.json "node --import tsx scripts/test-business-registration-emulator.mts"
      - name: Test full two-business flow with isolated atomic OWNER proposal (no rule deployment)
        run: npx firebase emulators:exec --only auth,firestore --project gioteautomatizo-registration-e2e-test --config firebase.invites-emulator.json "env TEST_ATOMIC_OWNER_PROPOSAL=1 node --import tsx scripts/test-business-registration-emulator.mts"
      - name: Test invitation API with Auth and Firestore emulators
        run: npx firebase emulators:exec --only auth,firestore --project gioteautomatizo-invites-test --config firebase.invites-emulator.json "node --import tsx scripts/test-business-invites.mjs"
      - name: Test VIP backend with dummy profiles in Firestore emulator
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-vip-api-test --config firebase.launch-security-emulator.json "node --import tsx scripts/test-vip-recovery-api.mjs"
      - name: Test legacy Calientito VIP admin compatibility in staged rules
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-vip-admin-compat-test --config firebase.launch-security-emulator.json "node scripts/test-vip-admin-compat.mjs"
      - name: Verify offline VIP migration preflight blockers
        run: node scripts/test-vip-migration-preflight.mjs
      - name: Test quick-sale receipts with repository Firestore rules
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-receipt-security-test --config firebase.launch-security-emulator.json "env SALE_RECEIPTS_RULES_FILE=firestore.rules node scripts/test-quick-sale-receipt-rules.mjs"
      - name: Test quick-sale receipts with staged Firestore rules
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-receipt-security-test --config firebase.launch-security-emulator.json "env SALE_RECEIPTS_RULES_FILE=docs/firestore.launch-security.STAGED.rules node scripts/test-quick-sale-receipt-rules.mjs"
      - name: Test paid and pending business order totals
        run: node --import tsx scripts/test-business-order-snapshot.mts
      - name: Check quick-sale idempotency blockers in current repository rules
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-idempotency-safety-test --config firebase.launch-security-emulator.json "env IDEMPOTENCY_RULE_FILE=firestore.rules node scripts/test-quick-sale-idempotency-staged.mjs"
      - name: Check quick-sale idempotency blockers in staged rules
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-idempotency-safety-test --config firebase.launch-security-emulator.json "env IDEMPOTENCY_RULE_FILE=docs/firestore.launch-security.STAGED.rules node scripts/test-quick-sale-idempotency-staged.mjs"
      - name: Test two concurrent cashiers only charge one order
        run: npx firebase emulators:exec --only firestore --project gioteautomatizo-charge-race-test --config firebase.launch-security-emulator.json "node scripts/test-offtable-charge-race.mjs"
      - name: Test quick-sale recovery journal and business isolation
        run: node --import tsx scripts/test-quick-sale-recovery-journal.mts
      - name: Verify recovered tickets match order folio, tenant and money
        run: node --import tsx scripts/test-offtable-receipt-guards.mts
