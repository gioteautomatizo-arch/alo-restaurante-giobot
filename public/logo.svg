<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="36" fill="#fbf9f4"/>
  <g transform="translate(250, 230)" text-anchor="middle">
    <!-- Main ¡ALÓ! Title -->
    <text y="0" font-family="'Playfair Display', 'Georgia', serif" font-weight="900" font-size="130" fill="#1b3824" letter-spacing="-2">
      ¡ALÓ!
    </text>
    
    <!-- Botanical Branch & Dividing Lines -->
    <g transform="translate(0, 50)">
      <!-- Left horizontal accent bar -->
      <line x1="-190" y1="0" x2="-65" y2="0" stroke="#b48a44" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Center Olive Branch -->
      <g transform="translate(0, 0)">
        <!-- Curved gold stem -->
        <path d="M -55,2 C -20,12 15,10 55,0" fill="none" stroke="#b48a44" stroke-width="4" stroke-linecap="round"/>
        <!-- Golden olive fruit / lower leaf -->
        <path d="M -2,10 C 12,22 30,18 24,10 C 18,2 4,2 -2,10 Z" fill="#b48a44"/>
        <!-- Leaf 1 (Left top) -->
        <path d="M -30,-4 C -20,-24 -5,-16 -12,0 C -18,4 -26,2 -30,-4 Z" fill="#1b3824"/>
        <!-- Leaf 2 (Center top) -->
        <path d="M -4,-2 C 5,-26 22,-20 12,0 C 5,4 -2,2 -4,-2 Z" fill="#1b3824"/>
        <!-- Leaf 3 (Right top) -->
        <path d="M 18,2 C 34,-12 52,-8 40,6 C 30,10 22,6 18,2 Z" fill="#1b3824"/>
      </g>
      
      <!-- Right horizontal accent bar -->
      <line x1="65" y1="0" x2="190" y2="0" stroke="#b48a44" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Subtitle: RESTAURANTE -->
    <text y="125" font-family="'Plus Jakarta Sans', 'Montserrat', 'Helvetica', sans-serif" font-weight="800" font-size="28" fill="#1b3824" letter-spacing="11">
      RESTAURANTE
    </text>
  </g>
</svg>
